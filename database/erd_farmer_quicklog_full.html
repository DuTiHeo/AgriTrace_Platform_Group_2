<h2 class="sr-only">Sơ đồ ERD đầy đủ hệ thống quản lý nông trại Farmer QuickLog</h2>
<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
    %% Foreign keys follow database/init_db.sql; optional relationships reflect nullable columns.
    USERS ||--o{ ORGANIZATIONS : "owns"
    ORGANIZATIONS |o--o{ USERS : "assigned_users"
    ORGANIZATIONS ||--o{ PLOTS : "contains"
    ORGANIZATIONS ||--o{ TEAMS : "has_teams"
    ORGANIZATIONS ||--o{ HARVEST_BATCHES : "has_batches"
    ORGANIZATIONS ||--o{ ERROR_REPORTS : "receives"
    USERS o|--o| TEAMS : "leads"
    TEAMS |o--o{ USERS : "has_members"
    CROP_CATALOG ||--o{ CROP_CARE_MILESTONES : "has_milestones"
    CROP_CATALOG ||--o{ SEASONS : "grown_in"
    PLOTS ||--o{ SEASONS : "has_seasons"
    SEASONS ||--o{ REMINDER_SCHEDULES : "has_reminders"
    SEASONS ||--o{ BATCH_SEASONS : "contributes_to"
    HARVEST_BATCHES ||--o{ BATCH_SEASONS : "contains"
    SEASONS ||--o{ SEASON_TEAM_ASSIGNMENTS : "has_support"
    TEAMS ||--o{ SEASON_TEAM_ASSIGNMENTS : "supports"
    SEASONS ||--o{ FARMING_LOGS : "has_logs"
    USERS ||--o{ FARMING_LOGS : "creates"
    TEAMS |o--o{ FARMING_LOGS : "snapshotted_for"
    FARMING_LOGS ||--o{ LOG_PHOTOS : "has_photos"
    FARMING_LOGS ||--o{ LOG_NOTES : "has_notes"
    USERS ||--o{ LOG_NOTES : "writes"
    TEAMS ||--o{ TASKS : "assigns"
    USERS ||--o{ TASKS : "receives"
    PLOTS ||--o{ TASKS : "hosts"
    USERS ||--o{ ERROR_REPORTS : "submits"
    USERS ||--o{ NOTIFICATIONS : "receives"
    USERS |o--o{ SYSTEM_LOGS : "performs"
    USERS ||--o{ TOKEN_BLACKLIST : "has_revoked_tokens"

    USERS {
        uuid user_id PK "DEFAULT uuid_generate_v4"
        varchar full_name "NOT NULL, 150"
        varchar phone UK "NOT NULL, 20"
        varchar national_id "NULL, 20; unique when not null"
        date date_of_birth "NULL"
        text address "NULL"
        varchar password_hash "NOT NULL, 255"
        varchar role "NOT NULL; owner, leader, worker, admin"
        varchar status "NOT NULL, default active; active, locked"
        uuid org_id FK "NULL, ON DELETE SET NULL"
        uuid team_id FK "NULL, ON DELETE SET NULL"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    ORGANIZATIONS {
        uuid org_id PK "DEFAULT uuid_generate_v4"
        varchar name "NOT NULL, 200"
        text address "NULL"
        uuid owner_id FK "NOT NULL"
        varchar status "NOT NULL, default incomplete; active, suspended, incomplete"
        geometry boundary_geojson "NULL, Polygon SRID 4326"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    PLOTS {
        uuid plot_id PK "DEFAULT uuid_generate_v4"
        uuid org_id FK "NOT NULL, ON DELETE CASCADE"
        varchar code "NOT NULL, 50; unique per organization"
        geometry boundary_geojson "NULL, Polygon SRID 4326"
        double area "NULL"
        varchar status "NOT NULL, default active; active, inactive"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    TEAMS {
        uuid team_id PK "DEFAULT uuid_generate_v4"
        uuid org_id FK "NOT NULL, ON DELETE CASCADE"
        varchar name "NOT NULL, 100; unique per organization"
        uuid team_leader_id FK "NULL, unique when not null"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    CROP_CATALOG {
        uuid crop_id PK "DEFAULT uuid_generate_v4"
        varchar name "NOT NULL, 150"
        int growth_days "NOT NULL, greater than 0"
        text planting_guide "NULL"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    CROP_CARE_MILESTONES {
        uuid milestone_id PK "DEFAULT uuid_generate_v4"
        uuid crop_id FK "NOT NULL, ON DELETE CASCADE"
        int days_after_planting "NOT NULL, at least 0"
        varchar task_type "NOT NULL, 50"
        text description "NULL"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
    }

    SEASONS {
        uuid season_id PK "DEFAULT uuid_generate_v4"
        uuid plot_id FK "NOT NULL"
        uuid crop_id FK "NOT NULL"
        date planting_date "NOT NULL"
        date expected_harvest_date "NULL"
        date actual_harvest_date "NULL"
        varchar status "NOT NULL, default growing; growing, ready_to_harvest, completed"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    REMINDER_SCHEDULES {
        uuid reminder_id PK "DEFAULT uuid_generate_v4"
        uuid season_id FK "NOT NULL, ON DELETE CASCADE"
        varchar milestone_type "NOT NULL, 50"
        date remind_date "NOT NULL"
        varchar channel "NULL, default push, 20"
        varchar status "NOT NULL, default scheduled; scheduled, sent, seen"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
    }

    HARVEST_BATCHES {
        uuid batch_id PK "DEFAULT uuid_generate_v4"
        varchar batch_code UK "NULL, 100"
        uuid org_id FK "NOT NULL"
        double quantity "NULL"
        date harvest_date "NULL"
        varchar status "NOT NULL, default pending; pending, ready, cancelled"
        varchar qr_url "NULL, 500"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    BATCH_SEASONS {
        uuid batch_id PK, FK "NOT NULL, ON DELETE CASCADE"
        uuid season_id PK, FK "NOT NULL"
        double contributed_quantity "NULL"
        varchar status "NOT NULL, default active; active, cancelled"
    }

    SEASON_TEAM_ASSIGNMENTS {
        uuid season_id PK, FK "NOT NULL, ON DELETE CASCADE"
        uuid team_id PK, FK "NOT NULL"
        date start_date "NULL"
        date end_date "NULL"
    }

    FARMING_LOGS {
        uuid log_id PK "DEFAULT uuid_generate_v4"
        uuid season_id FK "NOT NULL"
        uuid user_id FK "NOT NULL"
        uuid team_id FK "NULL, team snapshot at log creation"
        varchar activity_type "NULL, 50"
        text content "NULL"
        geometry gps "NULL, Point SRID 4326"
        timestamptz logged_at "DEFAULT CURRENT_TIMESTAMP"
    }

    LOG_PHOTOS {
        uuid photo_id PK "DEFAULT uuid_generate_v4"
        uuid log_id FK "NOT NULL, ON DELETE CASCADE"
        varchar url "NOT NULL, 500"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
    }

    LOG_NOTES {
        uuid note_id PK "DEFAULT uuid_generate_v4"
        uuid log_id FK "NOT NULL, ON DELETE CASCADE"
        uuid leader_id FK "NOT NULL"
        text content "NOT NULL"
        boolean resolved "NOT NULL, default false"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
    }

    TASKS {
        uuid task_id PK "DEFAULT uuid_generate_v4"
        uuid team_id FK "NOT NULL"
        uuid worker_id FK "NOT NULL"
        uuid plot_id FK "NOT NULL"
        text content "NOT NULL"
        timestamptz start_at "NOT NULL"
        timestamptz due_at "NOT NULL, later than start_at"
        varchar status "NOT NULL, default in_progress; in_progress, completed, cancelled"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    ERROR_REPORTS {
        uuid report_id PK "DEFAULT uuid_generate_v4"
        uuid user_id FK "NOT NULL"
        uuid org_id FK "NOT NULL"
        varchar error_type "NULL, 50"
        text description "NOT NULL"
        varchar screenshot_url "NULL, 500"
        varchar status "NOT NULL, default new; new, processing, resolved, rejected"
        text admin_response "NULL"
        timestamptz submitted_at "DEFAULT CURRENT_TIMESTAMP"
        timestamptz updated_at "DEFAULT CURRENT_TIMESTAMP"
    }

    NOTIFICATIONS {
        uuid notification_id PK "DEFAULT uuid_generate_v4"
        uuid user_id FK "NOT NULL, ON DELETE CASCADE"
        text content "NOT NULL"
        varchar type "NULL, 50"
        boolean is_read "NOT NULL, default false"
        timestamptz created_at "DEFAULT CURRENT_TIMESTAMP"
    }

    SYSTEM_LOGS {
        uuid log_id PK "DEFAULT uuid_generate_v4"
        uuid actor_id FK "NULL"
        varchar target_type "NULL, 50"
        uuid target_id "NULL"
        varchar action "NOT NULL, 50"
        timestamptz performed_at "DEFAULT CURRENT_TIMESTAMP"
        varchar result "NULL, default success, 20"
    }

    TOKEN_BLACKLIST {
        uuid jti PK
        uuid user_id FK "NOT NULL, ON DELETE CASCADE"
        timestamptz expires_at "NOT NULL"
        timestamptz revoked_at "DEFAULT CURRENT_TIMESTAMP"
    }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
